title:
  value: ANNOTATE
  progress_tracker: true
annotation:
  tools:
  - fixed_duration:
      min: 1
      step: 1
      max: 15
      initial_window: 1
  - time_select
  - start_end_time_select
  - bounding_box
  - multibox
  form: species_form
submission_buttons:
  line: true
  next:
    label: Skip
    icon: true
  submit:
    label: Submit
    icon: true
dynamic_forms:
  species_form:
  - text:
      value: '[[annotator_name||Annotator]], please select a species from the list
        below'
  - select:
      label: Species
      column: species
      required: true
      items:
        path: data/species_counts.N-dse.csv
        value: common_name
        filter_box: true
        custom_value: true
        not_available: Unknown
