# AUDIO CONFIG
audio:
    uri: "s3://dse-soundhub/public/audio/dev/20230522_200000.flac"

# ADDITIONAL PARAMS
ident_column: 'common_name'
capture: 'Save Spectrogram'
capture_dir: 'spectrograms'
default_buffer: 0

# FORM CONFIG
form_config:
    title:
        value: ANNOTATE
        progress_tracker: true
    select:
        label: species
        column: common_name
        required: true
        items:
            path: data/categories-small.csv
            value: common_name
    spectrogram_annotations:
        start_time:
            label: start
            column: start_time
            source_value: start_time
        end_time:
            label: end
            column: end_time
            source_value: end_time
        min_frequency:
            label: min freq
            column: min_freq
        max_frequency:
            label: max freq
            column: max_freq
        tools:
            - time_marker
            - start_end_time
            - bounding_box
    submission_buttons:
        line: true
        next:
            label: Skip
        submit:
            label: Submit