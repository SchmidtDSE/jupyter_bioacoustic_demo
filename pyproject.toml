[project]
name = "jupyter-bioacoustic-demo"
version = "0.1.0"
description = "Demo notebooks for the jupyter-bioacoustic plugin"
requires-python = ">=3.11"

# --- pixi ---

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
python = ">=3.11"
seaborn = "*"

[tool.pixi.pypi-dependencies]
##  For Testing release 
jupyter-bioacoustic = ">=0.8.5, <0.9.0"
##  For development use local path when needed. 
# jupyter-bioacoustic = { path = "../jupyter_bioacoustic", editable = true }
ipyleaflet = "*"
shapely = "*"
requests = "*"

[tool.pixi.tasks.generate-data]
cmd = "python scripts/generate_dev_data.py"
